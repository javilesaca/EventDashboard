<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>

    <!-- Enlace a la hoja de estilos CSS -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- Enlace a Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h1>Lista de Eventos <span id="live-badge" class="badge bg-success">EN VIVO</span></h1>
    <p class="text-muted">Los eventos nuevos aparecen automáticamente sin recargar la página.</p>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Mensaje</th>
            <th>Fuente</th>
            <th>Fecha</th>
        </tr>
        </thead>
        <tbody id="events-body">
        <!-- Iterar sobre los eventos que se pasaron desde el controlador -->
        <tr th:each="event : ${events}" class="event-row">
            <td th:text="${event.id}"></td>
            <td th:text="${event.type}"></td>
            <td th:text="${event.message}"></td>
            <td th:text="${event.source}"></td>
            <td th:text="${event.timestamp}"></td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Agregar scripts de Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

<script>
  const badge = document.getElementById('live-badge');
  const body = document.getElementById('events-body');
  const source = new EventSource('/api/events/stream');

  source.addEventListener('event', (e) => {
    let event;
    try {
      event = JSON.parse(e.data);
    } catch (err) {
      console.warn('Evento SSE inválido, ignorado', err);
      return;
    }
    const row = document.createElement('tr');
    row.className = 'event-row table-info';
    for (const key of ['id', 'type', 'message', 'source', 'timestamp']) {
      const cell = document.createElement('td');
      cell.textContent = event[key] ?? '';
      row.appendChild(cell);
    }
    body.prepend(row);
    setTimeout(() => row.classList.remove('table-info'), 3000);
  });

  source.onerror = () => {
    badge.className = 'badge bg-secondary';
    badge.textContent = 'DESCONECTADO';
  };
  source.onopen = () => {
    badge.className = 'badge bg-success';
    badge.textContent = 'EN VIVO';
  };
</script>

</body>
</html>
